services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: piprapay
      POSTGRES_USER: piprapay
      POSTGRES_PASSWORD: piprapay123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piprapay -d piprapay"]
      interval: 10s
      timeout: 5s
      retries: 5

  piprapay:
    build: ./piprapay
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=piprapay
      - DB_USER=piprapay
      - DB_PASSWORD=piprapay123
    volumes:
      - piprapay_data:/var/www/html/pp-content

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - PYTHONUNBUFFERED=1
    working_dir: /app
    depends_on:
      - piprapay

volumes:
  postgres_data:
  piprapay_data: