services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: piprapay
      MYSQL_USER: piprapay
      MYSQL_PASSWORD: piprapay123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  piprapay:
    build: ./piprapay
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=piprapay
      - DB_USER=piprapay
      - DB_PASSWORD=piprapay123
    volumes:
      - piprapay_data:/var/www/html/pp-content

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - PYTHONUNBUFFERED=1
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      piprapay:
        condition: service_started

volumes:
  mysql_data:
  piprapay_data: