database:
  host: "localhost"
  port: 5432
  name: "piprapay_poc"
  user: "postgres"
  password: "postgres"

piprapay:
  base_url: "http://localhost:8080"
  api_key: "your-piprapay-api-key"
  webhook_secret: "your-webhook-secret"

app:
  host: "0.0.0.0"
  port: 8000
  debug: true
  secret_key: "django-insecure-change-me-in-production"
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "*.app.github.dev"
    - "*.preview.app.github.dev"
