database:
  type: "sqlite"

sqlite:
  path: "db.sqlite3"

piprapay:
  base_url: "https://demo.piprapay.com"
  api_key: "GET-KEY-FROM-DEMO"
  webhook_secret: "demo-webhook-secret"

app:
  host: "0.0.0.0"
  port: 8000
  debug: true
  secret_key: "django-insecure-change-me-in-production"
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "*.app.github.dev"
    - "*.preview.app.github.dev"
